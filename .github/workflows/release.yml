name: Release

on:
    workflow_dispatch:

jobs:
    bump-version:
        if: true
        runs-on: ubuntu-latest
        name: "Bump version, update changelog, and create GitHub release"

        permissions:
            contents: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  # Full history is required for commitizen to determine version increments
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install commitizen
              run: pip install commitizen

            - name: Bump version and generate CHANGELOG.md
              id: cz
              uses: commitizen-tools/commitizen-action@master
              with:
                  github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
                  # Writes the changelog increment (only the new release section) to body.md
                  changelog_increment_filename: body.md
                  # Use our custom Jinja2 template for the full changelog
                  extra_requirements: ""

            # Generate RELEASE.md using the filtered template (no chores) for the new version only
            - name: Generate RELEASE.md
              if: env.REVISION != ''
              run: |
                  cz changelog --dry-run --template RELEASE.md.j2 --incremental > RELEASE.md

            - name: Commit and push RELEASE.md
              if: env.REVISION != ''
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add RELEASE.md
                  git diff --cached --quiet || git commit -m "chore: update release notes for v${{ env.REVISION }} [skip ci]"
                  git push
              env:
                  GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

            - name: Create GitHub release
              if: env.REVISION != ''
              uses: ncipollo/release-action@v1
              with:
                  tag: v${{ env.REVISION }}
                  name: "v${{ env.REVISION }}"
                  bodyFile: "RELEASE.md"
                  skipIfReleaseExists: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
